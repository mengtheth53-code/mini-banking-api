services:
  postgres:
    image: postgres:16-alpine
    container_name: minibanking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minibanking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minibanking"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - banking-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minibanking-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minibanking
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: MiniBankingProductionSecretKey2026AtLeast256BitsLongForSafeOperations!
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-net

volumes:
  postgres_data:
    driver: local

networks:
  banking-net:
    driver: bridge
