server:
  port: 8080

spring:
  application:
    name: mini-banking-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minibanking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:MiniBankingSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
  expiration-hours: 24

logging:
  level:
    root: INFO
    com.minibanking.api: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      # Banking Production Standard: Never allow automatic DDL updates in production!
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.minibanking.api: INFO
    org.hibernate.SQL: ERROR
